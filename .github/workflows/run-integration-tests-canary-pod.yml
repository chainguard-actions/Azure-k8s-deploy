name: Minikube Integration Tests - canary pod
on:
   pull_request:
      branches:
         - main
         - 'releases/*'
   push:
      branches:
         - main
         - 'releases/*'
   workflow_dispatch:

permissions: {}

jobs:
   run-integration-test:
      name: Canary Pod Tests
      runs-on: ubuntu-22.04
      env:
         KUBECONFIG: /home/runner/.kube/config
         NAMESPACE: test-${{ github.run_id }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - uses: ./.github/actions/minikube-setup
           name: Setup Minikube Environment
           timeout-minutes: 5

         - name: Create namespace to run tests
           env:
              NS: ${{ env.NAMESPACE }}
           run: kubectl create ns "$NS"

         - name: Cleaning any previously created items
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-delete.py 'Service' 'all' "$NS"
              python test/integration/k8s-deploy-delete.py 'Deployment' 'all' "$NS"
              python test/integration/k8s-deploy-delete.py 'Ingress' 'all' "$NS"

         - name: Executing deploy action for pod
           uses: ./
           with:
              namespace: ${{ env.NAMESPACE }}
              images: nginx:1.14.2
              manifests: |
                 test/integration/manifests/test.yml
              strategy: canary
              percentage: 50
              traffic-split-method: pod
              action: deploy

         - name: Checking if deployments and services were created with canary labels and original tag
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment-canary containerName=nginx:1.14.2 labels=workflow/version:canary,app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx,workflow/version:canary
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Service name=nginx-service labels=workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

         - name: Executing promote action for pod
           uses: ./
           with:
              namespace: ${{ env.NAMESPACE }}
              images: nginx:1.14.2
              manifests: |
                 test/integration/manifests/test.yml
              strategy: canary
              percentage: 50
              traffic-split-method: pod
              action: promote

         # another good place for anti-test - ensure old deps are deleted after promote
         - name: Checking if deployments and services were created with stable labels after first promote
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment containerName=nginx:1.14.2 labels=app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Service name=nginx-service labels=workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

         - name: Executing second deploy action for pod with new tag
           uses: ./
           with:
              namespace: ${{ env.NAMESPACE }}
              images: nginx:latest
              manifests: |
                 test/integration/manifests/test.yml
              strategy: canary
              percentage: 50
              traffic-split-method: pod
              action: deploy

         - name: Checking if deployments (with new tag) and services were created with canary labels after deploy, and old deployment persists
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment containerName=nginx:1.14.2 labels=app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment-canary containerName=nginx:latest labels=workflow/version:canary,app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx,workflow/version:canary

              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Service name=nginx-service labels=workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

         - name: Executing second promote action for pod now using new image tag
           uses: ./
           with:
              namespace: ${{ env.NAMESPACE }}
              images: nginx:latest
              manifests: |
                 test/integration/manifests/test.yml
              strategy: canary
              percentage: 50
              traffic-split-method: pod
              action: promote

         - name: Checking if deployments and services were created with stable labels after promote for new tag, ts is stable
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment containerName=nginx:latest labels=app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Service name=nginx-service labels=workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

         - name: Executing deploy action for pod to be rejected using old tag
           uses: ./
           with:
              namespace: ${{ env.NAMESPACE }}
              images: nginx:1.14.2
              manifests: |
                 test/integration/manifests/test.yml
              strategy: canary
              percentage: 50
              traffic-split-method: pod
              action: deploy

         - name: Checking if new deployments (with old tag) and services were created with canary and baseline labels after deploy, and stable deployment (with latest tag) persists
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment-canary containerName=nginx:1.14.2 labels=workflow/version:canary,app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx,workflow/version:canary
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment containerName=nginx:latest labels=app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Service name=nginx-service labels=workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

         - name: Executing reject action for pod to reject new deployment with 1.14.2 tag
           uses: ./
           with:
              namespace: ${{ env.NAMESPACE }}
              images: nginx:1.14.2
              manifests: |
                 test/integration/manifests/test.yml
              strategy: canary
              percentage: 50
              traffic-split-method: pod
              action: reject

         # MAY BE USEFUL TO ADD AN ANTI-CHECK - CHECK TO MAKE SURE CERTAIN OBJECTS DON'T EXIST
         - name: Checking if deployments and services were created with stable labels and latest tag after reject
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Deployment name=nginx-deployment containerName=nginx:latest labels=app:nginx,workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

              python test/integration/k8s-deploy-test.py "namespace=$NS" kind=Service name=nginx-service labels=workflow:actions.github.com-k8s-deploy,workflowFriendlyName:Minikube_Integration_Tests_-_canary_pod selectorLabels=app:nginx

         - name: Cleaning up current set up
           env:
              NS: ${{ env.NAMESPACE }}
           run: |
              python test/integration/k8s-deploy-delete.py 'Service' 'nginx-service' "$NS"
              python test/integration/k8s-deploy-delete.py 'Deployment' 'nginx-deployment' "$NS"

         - if: ${{ always() }}
           name: Delete created namespace
           env:
              NS: ${{ env.NAMESPACE }}
           run: kubectl delete ns "$NS"
