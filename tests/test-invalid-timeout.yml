name: Test invalid timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          manifests: tests/fixtures/manifests/deployment.yaml
          action: deploy
          strategy: basic
          timeout: 'not-a-valid-timeout'
          token: ${{ github.token }}

      - name: Assert action failed with invalid timeout error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the timeout value is not a valid duration.
          # parseDuration throws an error for invalid duration strings.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid timeout"
          else
            echo "FAIL: expected action to fail for invalid timeout, got '$OUTCOME'"
            exit 1
          fi
