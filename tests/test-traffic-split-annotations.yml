name: Test traffic-split-annotations input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal manifest file
        run: |
          mkdir -p /tmp/k8s-manifests
          cat > /tmp/k8s-manifests/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                - name: test-app
                  image: nginx:latest
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          manifests: /tmp/k8s-manifests/deployment.yaml
          strategy: canary
          action: deploy
          token: ${{ github.token }}
          traffic-split-method: smi
          traffic-split-annotations: |
            app.kubernetes.io/managed-by: test-manager
            example.com/team: platform
          percentage: 20

      - name: Assert action ran (no cluster available, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real cluster available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no k8s cluster context available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
