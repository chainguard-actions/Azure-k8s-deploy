name: Test canary deployment with traffic-split-annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal manifest file
        run: |
          mkdir -p /tmp/k8s-manifests
          cat > /tmp/k8s-manifests/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                - name: test-app
                  image: contosodemo.azurecr.io/helloworld:latest
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          manifests: /tmp/k8s-manifests/deployment.yaml
          strategy: canary
          action: deploy
          pull-images: false
          percentage: 20
          traffic-split-method: pod
          traffic-split-annotations: |
            app.kubernetes.io/managed-by: test-harness
            example.com/canary: "true"
          baseline-and-canary-replicas: 1
          token: ${{ github.token }}
      - name: Assert action ran (outputs set, or failed gracefully without a cluster)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real k8s cluster available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
