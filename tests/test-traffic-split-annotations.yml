name: Test traffic-split-annotations input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy manifest file
        run: |
          mkdir -p /tmp/k8s-manifests
          cat > /tmp/k8s-manifests/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                - name: test-app
                  image: nginx:latest
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          manifests: /tmp/k8s-manifests/deployment.yaml
          images: nginx:latest
          strategy: canary
          action: deploy
          percentage: 20
          traffic-split-method: smi
          traffic-split-annotations: "app.kubernetes.io/managed-by: test,example.com/team: platform"
          token: ${{ github.token }}
      - name: Assert action ran (traffic-split-annotations input accepted, or failed gracefully without cluster)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with traffic-split-annotations input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no cluster context available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
