name: Test invalid action input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          manifests: |
            ${{ github.workspace }}/tests/fixtures/manifests/deployment.yaml
          strategy: basic
          action: invalid-action-value
          namespace: default
          pull-images: false
          annotate-resources: false

      - name: Assert action failed (invalid action value should cause failure)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for invalid action input"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid action value"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
