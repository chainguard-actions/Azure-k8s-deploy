name: Test image substitution with imagepullsecrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal manifest file
        run: |
          mkdir -p /tmp/k8s-manifests
          cat > /tmp/k8s-manifests/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                - name: test-app
                  image: contosodemo.azurecr.io/helloworld:latest
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          manifests: /tmp/k8s-manifests/deployment.yaml
          images: contosodemo.azurecr.io/helloworld:v1.0.0
          imagepullsecrets: my-registry-secret
          strategy: basic
          action: deploy
          pull-images: false
          token: ${{ github.token }}
      - name: Assert action ran (outputs set, or failed gracefully without a cluster)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real k8s cluster available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
