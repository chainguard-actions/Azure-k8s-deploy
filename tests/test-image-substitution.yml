name: Test image substitution in manifests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create manifest file with image placeholder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/manifests"
          cat > "$GITHUB_WORKSPACE/tests/manifests/deployment.yaml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                - name: test-app
                  image: contosodemo.azurecr.io/helloworld:latest
          EOF

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          manifests: tests/manifests/deployment.yaml
          images: contosodemo.azurecr.io/helloworld:v1.0.0
          strategy: basic
          action: deploy
          pull-images: false
          token: ${{ github.token }}

      - name: Assert action ran and failed gracefully (no cluster available)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no cluster configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
