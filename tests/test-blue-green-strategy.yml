name: Test blue-green deployment strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          manifests: tests/fixtures/manifests/deployment.yaml
          action: deploy
          strategy: blue-green
          route-method: service
          version-switch-buffer: 0
          token: ${{ github.token }}

      - name: Assert action ran with blue-green strategy (fails gracefully without cluster)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a real Kubernetes cluster, the action is expected to fail
          # when trying to run kubectl. We verify it fails (not skipped/cancelled)
          # and does NOT fail due to missing required inputs or invalid strategy.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no cluster available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (cluster was available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
