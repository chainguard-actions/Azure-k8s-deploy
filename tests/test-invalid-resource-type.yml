name: Test invalid resource-type causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock kubectl and kubeconfig
        run: |
          # Create a mock kubectl that succeeds for all commands
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/kubectl" << 'EOF'
          #!/bin/sh
          echo "mock-kubectl called with: $*" >&2
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Create a minimal kubeconfig
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" << 'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://localhost:6443
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token
          EOF
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          manifests: tests/fixtures/manifests/deployment.yaml
          action: deploy
          strategy: basic
          pull-images: false
          annotate-resources: false
          resource-type: 'Microsoft.ContainerService/invalidType'
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to invalid resource-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid resource-type, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid resource-type"
