name: Test invalid resource-type input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal manifest file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/manifests"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/manifests/deployment.yml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                  - name: test-app
                    image: nginx:latest
          EOF

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          manifests: tests/fixtures/manifests/deployment.yml
          action: deploy
          strategy: basic
          resource-type: Microsoft.ContainerService/invalidType
          token: ${{ github.token }}

      - name: Assert action failed due to invalid resource-type
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid resource-type"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid resource-type but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
