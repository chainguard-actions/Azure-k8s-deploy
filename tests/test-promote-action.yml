name: Test promote action scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - id: promote
        uses: .
        continue-on-error: true
        with:
          manifests: |
            ${{ github.workspace }}/tests/fixtures/manifests/deployment.yaml
            ${{ github.workspace }}/tests/fixtures/manifests/service.yaml
          strategy: blue-green
          action: promote
          namespace: default
          route-method: service
          pull-images: false
          annotate-resources: false

      - name: Assert action ran and failed gracefully (no k8s cluster available)
        env:
          OUTCOME: ${{ steps.promote.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (k8s cluster was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no k8s cluster context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
