name: Test canary strategy scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal manifest file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/manifests"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/manifests/deployment.yml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
            namespace: default
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                  - name: test-app
                    image: nginx:latest
          EOF

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          manifests: tests/fixtures/manifests/deployment.yml
          action: deploy
          strategy: canary
          percentage: 20
          baseline-and-canary-replicas: 1
          traffic-split-method: pod
          token: ${{ github.token }}

      - name: Assert action ran and failed gracefully (no cluster available)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no cluster context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
